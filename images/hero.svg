    <circle cx="1400" cy="80" r="1.7"/><circle cx="1500" cy="220" r="1.1"/><circle cx="880" cy="230" r="1"/>
    <circle cx="420" cy="260" r="1.1"/><circle cx="1100" cy="290" r="1.3"/><circle cx="240" cy="330" r="1"/>
  </g>
  <circle cx="1180" cy="520" r="150" fill="url(#sun)" opacity="0.9"/>
