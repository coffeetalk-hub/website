<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A sailboat on a calm sea at dusk with a lighthouse on the shore">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07162B"/>
      <stop offset="0.55" stop-color="#12315A"/>
      <stop offset="1" stop-color="#2F6396"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4C7C"/>
      <stop offset="1" stop-color="#07162B"/>
