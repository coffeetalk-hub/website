<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#140d09" />
    <!-- Title/description/og:locale/hreflang are updated per language at runtime in src/i18n/index.tsx -->
    <title>كوفي توك للسائقين — توصيل قهوة، بشروطك</title>
    <meta name="description" content="قدّم كسائق مع كوفي توك: فعّل «متاح الآن» وقت ما يناسبك، خذ الطلبات اللي تبغاها، وخلّ التطبيق يختار لك أفضل مسار." />
    <!-- TODO(launch): set the canonical site URL and an og:image (1200×630) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoffeeTalk" />
    <meta property="og:title" content="كوفي توك للسائقين — توصيل قهوة، بشروطك" />
    <meta property="og:description" content="قدّم كسائق مع كوفي توك: فعّل «متاح الآن» وقت ما يناسبك، خذ الطلبات اللي تبغاها، وخلّ التطبيق يختار لك أفضل مسار." />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      // Set language + direction before first paint (no LTR/RTL flash).
      // Order: ?lang= query → localStorage "ct-driver-lang" → Arabic (default).
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('lang');
          var saved = localStorage.getItem('ct-driver-lang');
          var lang = q === 'en' || q === 'ar' ? q : saved === 'en' || saved === 'ar' ? saved : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
