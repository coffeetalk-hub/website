<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C120D" />
    <meta
      name="description"
      content="CoffeeTalk — Saudi Arabia's AI-native coffee platform. Order by voice or photo, book a table, order from several cafés at once, and earn smarter loyalty."
    />
    <title>CoffeeTalk — Saudi Arabia's AI-native coffee platform</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Set language + direction before first paint so there is no LTR→RTL flash.
      // Mirrors the logic in src/i18n.tsx (localStorage "ct-lang", then navigator.language).
      (function () {
        try {
          var saved = localStorage.getItem('ct-lang');
          var nav = (navigator.language || '').toLowerCase();
          var lang = saved === 'ar' || saved === 'en' ? saved : nav.indexOf('ar') === 0 ? 'ar' : 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
